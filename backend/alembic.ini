# Alembic configuration for the Universal Accounting Platform backend.
# Generated/configured in Session 2. Run from the backend/ directory:
#     python -m alembic upgrade head

[alembic]
# Path to migration scripts (relative to this file's directory)
script_location = alembic
# Put the backend/ directory on sys.path so "app" is importable from env.py
prepend_sys_path = .

# The real URL is injected by alembic/env.py from app settings (backend/.env).
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
